<!doctype html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>University Exam Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(16,185,129,.28); outline-offset: 2px; }
    .scrollbar-thin { scrollbar-width: thin; }
    .fade-in { animation: fade .18s ease-out; }
    @keyframes fade { from { opacity: .5; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",

    }
  }
  </script>

</head>
<body>
  <div id="root">
    <div class="min-h-screen flex items-center justify-center text-slate-500 text-sm">Loading University Exam Prep…</div>
  </div>

  <script type="text/babel" data-type="module" data-presets="react">

      targetGrade: 'A',
      documents: [],

        { id: 's2', number: 2, title: 'Session 2: The Marketing Environment', topics: ['Microenvironment Actors', 'Macroenvironment Forces', 'Demographic & Political Environments', 'Value Delivery Network'] },
        { id: 's3', number: 3, title: 'Session 3: Consumer Markets & Buyer Behavior', topics: ['Model of Buyer Behavior', 'Cultural, Social, Personal, Psychological Factors', 'Buying Decision Process', 'Adoption of New Products'] },

        { id: 's5', number: 5, title: 'Session 5: Managing Marketing Information & Customer Insights', topics: ['Marketing Information Ecosystem', 'Customer Insights Teams', 'Primary vs Secondary Data', 'Observational, Ethnographic, Survey & Experimental Research'] },
        { id: 's6', number: 6, title: 'Session 6: Customer Value-Driven Marketing Strategy', topics: ['Market Segmentation', 'Target Marketing', 'Differentiation & Positioning', 'Value Proposition'] },
        { id: 's78', number: 7, title: 'Session 7 & 8: Products, Services, and Brands', topics: ['Three Levels of Product', 'Product & Service Classifications', 'Experiences vs Commoditization', 'Brand Equity & Strategy'] },
        { id: 's9', number: 9, title: 'Session 9: Pricing Strategies', topics: ['Price Definition & Revenue Role', 'Discount & Allowance Pricing', 'Segmented Pricing', 'Psychological, Promotional, Geographical & Dynamic Pricing'] },
        { id: 's10', number: 10, title: 'Session 10: Marketing Channels', topics: ['How Channel Members Add Value', 'Direct vs Indirect Channels', 'Horizontal vs Vertical Conflict', 'Horizontal & Multichannel Systems', 'Disintermediation'] },

    const INITIAL_QUESTIONS = [
      { id:'q-mkt-01', courseCode:'MKT101', sessionId:'s1', sessionTitle:'Session 1: Defining Marketing & Marketing Process', topic:'5-Step Marketing Process', difficultyLevel:1, difficulty:'Pass', origin:'Previous Exam (VNUK Quiz #1)', sourceDoc:'VNUK Quiz #1 (Q1)', question:'According to the five-step model of the marketing process, a company should ________ before designing a customer-driven marketing strategy.', options:['determine how to deliver superior value to customers','build profitable relationships with customers','use customer relationship management to create full partnerships','understand the marketplace and customer needs and wants','construct an integrated marketing program'], correctIndex:3, explanationVi:'Bước đầu tiên của quy trình marketing 5 bước là thấu hiểu thị trường, nhu cầu và mong muốn của khách hàng. Doanh nghiệp cần hiểu khách hàng trước khi thiết kế chiến lược hướng đến khách hàng.' },
      { id:'q-mkt-02', courseCode:'MKT101', sessionId:'s1', sessionTitle:'Session 1: Defining Marketing & Marketing Process', topic:'Marketing Management Orientations', difficultyLevel:2, difficulty:'C', origin:'Previous Exam (VNUK Quiz #1)', sourceDoc:'VNUK Quiz #1 (Q5 & Q6)', question:'A company believes its products are superior but its sales are declining. It focuses on the products rather than the benefits and experiences customers need. What problem does it have?', options:['Market offering dystopia','Demand focus','Value proposition','Marketing myopia','Marketing immersion'], correctIndex:3, explanationVi:'Marketing myopia là tình trạng doanh nghiệp quá tập trung vào sản phẩm cụ thể mà quên đi nhu cầu, lợi ích và trải nghiệm thực sự của khách hàng. Doanh nghiệp cần nhìn vào nhu cầu khách hàng thay vì chỉ nhìn vào sản phẩm hiện tại.' },
      { id:'q-mkt-03', courseCode:'MKT101', sessionId:'s2', sessionTitle:'Session 2: The Marketing Environment', topic:'Demographic Environment', difficultyLevel:2, difficulty:'B', origin:'Previous Exam (VNUK Quiz #1)', sourceDoc:'VNUK Quiz #1 (Q10)', question:'A smartphone company studies the size, density, location, age and occupation of its target market. Which environment is being studied?', options:['Demographic environment','Political environment','Economic environment','Technological environment','Cultural environment'], correctIndex:0, explanationVi:'Demographic environment là môi trường nhân khẩu học. Nó nghiên cứu quy mô, mật độ, vị trí, tuổi, giới tính, nghề nghiệp và các đặc điểm của dân số.' },
      { id:'q-mkt-04', courseCode:'MKT101', sessionId:'s2', sessionTitle:'Session 2: The Marketing Environment', topic:'Political Environment', difficultyLevel:1, difficulty:'Pass', origin:'Previous Exam (VNUK Quiz #1)', sourceDoc:'VNUK Quiz #1 (Q11)', question:'Which environment consists of laws, government agencies and pressure groups that influence or limit organizations and individuals?', options:['Socio-legal','Cultural','Political','Technological','Economic'], correctIndex:2, explanationVi:'Political environment bao gồm luật pháp, cơ quan chính phủ và các nhóm gây áp lực có ảnh hưởng hoặc giới hạn hoạt động của tổ chức và cá nhân.' },
      { id:'q-mkt-05', courseCode:'MKT101', sessionId:'s5', sessionTitle:'Session 5: Managing Marketing Information & Customer Insights', topic:'Ethnographic Research', difficultyLevel:2, difficulty:'B', origin:'Lecture Slide', sourceDoc:'Session 5 - Primary Data Collection', question:'Under Intuit’s “follow-me-home” program, employees visit customers at home or at work to observe them using products in real life. Which research method is this?', options:['Experimental research','Ethnographic research','Survey research','Secondary data analysis'], correctIndex:1, explanationVi:'Ethnographic research là phương pháp quan sát và tương tác với người tiêu dùng trong môi trường tự nhiên của họ, ví dụ tại nhà hoặc văn phòng. Đây là nghiên cứu quan sát để hiểu hành vi thực tế.' },
      { id:'q-mkt-06', courseCode:'MKT101', sessionId:'s5', sessionTitle:'Session 5: Managing Marketing Information & Customer Insights', topic:'Marketing Information Ecosystem', difficultyLevel:2, difficulty:'B+', origin:'Lecture Slide', sourceDoc:'Session 5 - Marketing Information Ecosystem', question:'Which term refers to the people, processes and assets used to assess managers’ information needs, develop information and help decision makers generate actionable customer insights?', options:['Customer Relationship Management','Marketing Information Ecosystem','Enterprise Resource Planning','Observational Research Network'], correctIndex:1, explanationVi:'Marketing Information Ecosystem là hệ thống gồm con người, quy trình và tài sản để xác định nhu cầu thông tin, phát triển thông tin cần thiết và hỗ trợ nhà quản trị tạo ra customer insights có thể hành động.' },
      { id:'q-mkt-07', courseCode:'MKT101', sessionId:'s78', sessionTitle:'Session 7 & 8: Products, Services, and Brands', topic:'Three Levels of Product', difficultyLevel:2, difficulty:'B', origin:'Lecture Slide', sourceDoc:'Session 7 & 8 - Levels of Product', question:'Brand name, quality, packaging, design and features belong to which product level, while warranty and after-sale service belong to which level?', options:['Core Customer Value vs Actual Product','Actual Product vs Augmented Product','Augmented Product vs Core Customer Value','Primary Product vs Secondary Product'], correctIndex:1, explanationVi:'Actual Product gồm thương hiệu, chất lượng, bao bì, thiết kế và tính năng. Augmented Product gồm dịch vụ giao hàng, bảo hành, tín dụng và hậu mãi. Core Customer Value là lợi ích cốt lõi khách hàng thực sự mua.' },
      { id:'q-mkt-08', courseCode:'MKT101', sessionId:'s9', sessionTitle:'Session 9: Pricing Strategies', topic:'Segmented Pricing', difficultyLevel:2, difficulty:'B+', origin:'Lecture Slide', sourceDoc:'Session 9 - Segmented Pricing', question:'A company sells the same product or service at two or more prices, even though the price differences are not based on differences in cost. Which strategy is this?', options:['Discount and allowance pricing','Segmented pricing','Psychological pricing','Geographical pricing'], correctIndex:1, explanationVi:'Segmented pricing là bán cùng một sản phẩm hoặc dịch vụ ở hai hay nhiều mức giá khác nhau, trong đó chênh lệch giá không dựa trên chênh lệch chi phí. Ví dụ: vé xem phim cho sinh viên và người lớn.' },
      { id:'q-mkt-09', courseCode:'MKT101', sessionId:'s9', sessionTitle:'Session 9: Pricing Strategies', topic:'Marketing Mix Revenue', difficultyLevel:1, difficulty:'Pass', origin:'Lecture Slide', sourceDoc:'Session 9 - Pricing Strategies (Slide 2)', question:'Which element of the marketing mix is the only one that directly generates revenue rather than representing costs?', options:['Product','Price','Place (Distribution)','Promotion'], correctIndex:1, explanationVi:'Price là yếu tố duy nhất trong marketing mix trực tiếp tạo ra doanh thu. Product, Place và Promotion chủ yếu đại diện cho chi phí.' },
      { id:'q-mkt-10', courseCode:'MKT101', sessionId:'s10', sessionTitle:'Session 10: Marketing Channels', topic:'Disintermediation', difficultyLevel:3, difficulty:'A+', origin:'Lecture Slide', sourceDoc:'Session 10 - Disintermediation', question:'Airbnb’s disruption of traditional hotel distribution and ride-sharing platforms replacing traditional taxi intermediaries are examples of which channel phenomenon?', options:['Multichannel distribution system','Horizontal marketing system','Disintermediation','Vertical channel conflict'], correctIndex:2, explanationVi:'Disintermediation là quá trình loại bỏ trung gian truyền thống hoặc thay thế họ bằng các trung gian mới như nền tảng công nghệ.' },
      { id:'q-mkt-11', courseCode:'MKT101', sessionId:'s10', sessionTitle:'Session 10: Marketing Channels', topic:'Horizontal Marketing Systems', difficultyLevel:3, difficulty:'A', origin:'Lecture Slide', sourceDoc:'Session 10 - Horizontal Systems', question:'Two companies operating at the same channel level cooperate to pursue a new marketing opportunity. What is this arrangement called?', options:['Vertical marketing system','Horizontal marketing system','Direct marketing channel','Franchise organization'], correctIndex:1, explanationVi:'Horizontal marketing system là sự hợp tác giữa hai hoặc nhiều doanh nghiệp ở cùng một cấp độ kênh phân phối để theo đuổi cơ hội marketing mới.' },
      { id:'q-mkt-12', courseCode:'MKT101', sessionId:'s1112', sessionTitle:'Session 11 & 12: Integrated Marketing Communication', topic:'Integrating the Promotional Mix', difficultyLevel:2, difficulty:'B', origin:'Lecture Slide', sourceDoc:'Session 11 & 12 - Integrated Promotional Mix', question:'According to the principle of integrating the promotional mix, where should an integrated promotion mix start?', options:['The company budget','Customers and their communication needs','Competitors’ promotional channels','Wholesalers and inventory'], correctIndex:1, explanationVi:'Hỗn hợp xúc tiến tích hợp phải bắt đầu từ khách hàng, nhằm bảo đảm truyền thông diễn ra đúng lúc, đúng nơi và đúng cách khách hàng cần, đồng thời giữ thông điệp thương hiệu nhất quán.' }
    ];

    const KEYWORDS = [
      { id:'kw1', term:'Marketing Myopia', meaningVi:'Chứng thiển cận trong Marketing', session:'Session 1', definitionEn:'Focusing on products rather than the customer benefits and experiences they create.', explanationVi:'Doanh nghiệp quá chú trọng sản phẩm hiện tại và bỏ quên nhu cầu cốt lõi của khách hàng.', example:'Một hãng vận tải chỉ nghĩ mình kinh doanh tàu hỏa thay vì giải quyết nhu cầu di chuyển.' },
      { id:'kw2', term:'Marketing Information Ecosystem', meaningVi:'Hệ sinh thái thông tin Marketing', session:'Session 5', definitionEn:'People, processes and assets used to develop information and actionable customer insights.', explanationVi:'Hệ thống kết hợp con người, quy trình và dữ liệu để biến thông tin thành thấu hiểu khách hàng có thể hành động.', example:'Nhóm customer insights lấy dữ liệu từ marketing, sales và chăm sóc khách hàng.' },
      { id:'kw3', term:'Ethnographic Research', meaningVi:'Nghiên cứu dân tộc học', session:'Session 5', definitionEn:'Observing and interacting with consumers in their natural environments.', explanationVi:'Quan sát người tiêu dùng trong môi trường tự nhiên như nhà riêng hoặc nơi làm việc để hiểu hành vi thực tế.', example:'Nhân viên Intuit quan sát khách hàng sử dụng phần mềm tại nhà.' },
      { id:'kw4', term:'Three Levels of Product', meaningVi:'Ba cấp độ của sản phẩm', session:'Session 7 & 8', definitionEn:'Core customer value, actual product and augmented product.', explanationVi:'Core là lợi ích cốt lõi; Actual là sản phẩm hữu hình; Augmented là dịch vụ và lợi ích bổ sung.', example:'Với điện thoại: nhu cầu kết nối là Core; thiết kế và tính năng là Actual; bảo hành là Augmented.' },
      { id:'kw5', term:'Segmented Pricing', meaningVi:'Định giá phân khúc', session:'Session 9', definitionEn:'Selling a product or service at different prices when the price differences are not based on cost differences.', explanationVi:'Cùng sản phẩm hoặc dịch vụ có nhiều mức giá theo nhóm khách hàng, thời gian hoặc địa điểm, không phải do chi phí khác nhau.', example:'Giá vé xem phim cho sinh viên thấp hơn giá vé người lớn.' },
      { id:'kw6', term:'Disintermediation', meaningVi:'Loại bỏ hoặc thay thế trung gian', session:'Session 10', definitionEn:'Removing traditional intermediaries or replacing them with new types of intermediaries.', explanationVi:'Nhà sản xuất bán trực tiếp hoặc nền tảng mới thay thế trung gian truyền thống trong kênh phân phối.', example:'Nền tảng đặt phòng trực tuyến thay đổi cách khách hàng tiếp cận nơi lưu trú.' },
      { id:'kw7', term:'Horizontal vs Vertical Conflict', meaningVi:'Xung đột ngang và xung đột dọc', session:'Session 10', definitionEn:'Horizontal conflict occurs at the same channel level; vertical conflict occurs between different levels.', explanationVi:'Xung đột ngang xảy ra giữa các thành viên cùng cấp; xung đột dọc xảy ra giữa các cấp khác nhau trong cùng kênh.', example:'Hai nhà bán lẻ cạnh tranh là xung đột ngang; nhà sản xuất và nhà bán lẻ bất đồng là xung đột dọc.' }
    ];

    const GRADES = [
      {id:'Pass',label:'Pass',desc:'Focus on essential concepts and foundational knowledge.',weights:[80,20,0],color:'bg-emerald-600'},
      {id:'C',label:'C / C+',desc:'Understand key definitions and apply basic concepts.',weights:[60,35,5],color:'bg-teal-600'},
      {id:'B',label:'B / B+',desc:'Combine theory, applications and common concept comparisons.',weights:[40,50,10],color:'bg-emerald-700'},
      {id:'A',label:'A',desc:'Cover the syllabus and solve applied scenarios.',weights:[25,45,30],color:'bg-green-800'},
      {id:'A+',label:'A+',desc:'Practice advanced reasoning and integrated concepts.',weights:[20,40,40],color:'bg-emerald-950'}
    ];

    function readSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    function saveState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { console.warn('Could not save local state:', error); }
    }

    function IconButton({children, onClick, label, className=''}) {
      return <button type="button" aria-label={label} title={label} onClick={onClick} className={`inline-flex items-center justify-center rounded-lg transition ${className}`}>{children}</button>;
    }

    function NavButton({icon:Icon,label,active,onClick,badge}) {
      return <button type="button" onClick={onClick} className={`w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-left text-xs font-bold transition ${active?'bg-emerald-600 text-white shadow-sm':'text-slate-600 hover:bg-slate-100'}`}>
        <span className="flex items-center gap-3 min-w-0"><Icon size={16} className="shrink-0"/><span className="truncate">{label}</span></span>
        {badge && <span className={`text-[10px] rounded-full px-2 py-0.5 ${active?'bg-emerald-800 text-white':'bg-slate-100 text-slate-600'}`}>{badge}</span>}
      </button>;
    }

    function App() {
      const saved = useMemo(() => readSavedState(), []);
      const [courses,setCourses] = useState(saved?.courses || [DEFAULT_MARKETING_COURSE]);
      const [activeCourseId,setActiveCourseId] = useState(saved?.activeCourseId || DEFAULT_MARKETING_COURSE.id);
      const [questions,setQuestions] = useState(saved?.questions || INITIAL_QUESTIONS);
      const [attempted,setAttempted] = useState(saved?.attempted || {});
      const [documents,setDocuments] = useState(saved?.documents || {});
      const [xp,setXp] = useState(saved?.xp ?? 350);
      const [streak] = useState(saved?.streak ?? 1);
      const [view,setView] = useState('roadmap');
      const [mobileMenu,setMobileMenu] = useState(false);

      const activeCourse = courses.find(c=>c.id===activeCourseId) || courses[0];

      useEffect(()=>saveState({courses,activeCourseId,questions,attempted,documents,xp,streak}),[courses,activeCourseId,questions,attempted,documents,xp,streak]);

      const updateCourse = (updated) => setCourses(prev=>prev.map(c=>c.id===updated.id?updated:c));
      const navigate = (next) => {setView(next);setMobileMenu(false);};
      const navItems = [
        [MapIcon,'Study Roadmap','roadmap'],[Play,'Practice Quiz','quiz'],[BookOpen,'Theory Review','theory'],
        [UploadCloud,'Document Library','documents'],[BarChart2,'Analytics','analytics'],[Bot,'AI Study Assistant','ai'],[Layers,'All Courses','courses']
      ];

      return <div className="min-h-screen md:h-screen w-full flex flex-col md:flex-row bg-slate-50 text-slate-800 overflow-hidden">
        <header className="md:hidden h-14 shrink-0 bg-emerald-900 text-white px-3 flex items-center justify-between shadow z-30">
          <div className="flex items-center gap-2 min-w-0"><GraduationCap size={22}/><div className="min-w-0"><div className="font-extrabold text-sm">University Exam Prep</div><div className="text-[10px] text-emerald-200 truncate max-w-[190px]">{activeCourse?.name}</div></div></div>
          <div className="flex items-center gap-2"><span className="text-[11px] font-bold text-amber-300">⚡ {xp} XP</span><IconButton label="Open menu" onClick={()=>setMobileMenu(v=>!v)} className="p-2 hover:bg-emerald-800">{mobileMenu?<X size={20}/>:<Menu size={20}/>}</IconButton></div>
        </header>

        {mobileMenu && <button aria-label="Close navigation" className="fixed inset-0 top-14 bg-black/40 z-30 md:hidden" onClick={()=>setMobileMenu(false)} />}
        <aside className={`${mobileMenu?'fixed top-14 bottom-0 left-0 z-40 flex':'hidden'} md:static md:flex md:w-64 md:shrink-0 bg-white border-r border-slate-200 flex-col w-[min(82vw,300px)]`}>
          <div className="hidden md:flex items-center gap-3 px-5 py-5 border-b border-slate-100"><div className="p-2.5 rounded-xl bg-emerald-600 text-white"><GraduationCap size={22}/></div><div><div className="font-black text-sm text-slate-900">University Exam Prep</div><div className="text-[10px] text-emerald-700 font-bold">LEARNING WORKSPACE</div></div></div>
          <div className="p-3 bg-emerald-50 border-b border-emerald-100"><div className="flex justify-between items-center mb-1"><label className="text-[10px] uppercase tracking-wider font-extrabold text-emerald-800">Active Course</label><button onClick={()=>navigate('courses')} className="text-[10px] font-bold text-emerald-700">Switch</button></div><select aria-label="Active course" value={activeCourseId} onChange={e=>setActiveCourseId(e.target.value)} className="w-full bg-white border border-emerald-200 rounded-lg px-2 py-2 text-xs font-bold">{courses.map(c=><option key={c.id} value={c.id}>{c.code}: {c.name}</option>)}</select></div>
          <nav className="p-3 space-y-1 flex-1 overflow-y-auto">{navItems.map(([Icon,label,key])=><NavButton key={key} icon={Icon} label={label} active={view===key} onClick={()=>navigate(key)} badge={key==='documents'?(documents[activeCourseId]||[]).length:undefined}/>)}</nav>
          <div className="p-4 border-t border-slate-100 flex justify-between text-xs font-bold"><span className="text-orange-600 flex items-center gap-1"><Flame size={15}/> {streak} day streak</span><span className="text-emerald-700 flex items-center gap-1"><Zap size={15}/> {xp} XP</span></div>
        </aside>

        <main className="flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden">
          <div className="hidden md:flex bg-white border-b border-slate-200 px-6 py-3 items-center justify-between shrink-0"><div className="min-w-0"><div className="flex items-center gap-2"><span className="text-[10px] font-extrabold bg-emerald-100 text-emerald-800 rounded px-2 py-1">{activeCourse?.code}</span><h1 className="font-extrabold text-sm truncate">{activeCourse?.name}</h1></div><p className="text-[11px] text-slate-500 mt-1">{activeCourse?.university} · {activeCourse?.faculty}</p></div><div className="flex items-center gap-2 text-xs font-bold"><span className="rounded-lg bg-slate-100 px-3 py-2">Goal: {activeCourse?.targetGrade}</span><span className="rounded-lg bg-emerald-50 text-emerald-800 px-3 py-2">Exam: {activeCourse?.examDate}</span></div></div>
          <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 scrollbar-thin">
            <div className="max-w-6xl mx-auto fade-in" key={view}>
              {view==='roadmap' && <Roadmap course={activeCourse} questions={questions} attempted={attempted} onUpdateCourse={updateCourse} onStartQuiz={(filter)=>{setView('quiz');window.setTimeout(()=>window.dispatchEvent(new CustomEvent('set-quiz-filter',{detail:filter})),0)}} onTheory={()=>navigate('theory')}/>}
              {view==='documents' && <Documents course={activeCourse} docs={documents[activeCourseId]||[]} onDocsChange={next=>setDocuments(prev=>({...prev,[activeCourseId]:next}))} />}
              {view==='theory' && <Theory/>}
              {view==='quiz' && <Quiz course={activeCourse} questions={questions} attempted={attempted} setAttempted={setAttempted} addXp={amount=>setXp(v=>v+amount)}/>}
              {view==='analytics' && <Analytics course={activeCourse} questions={questions} attempted={attempted} onPractice={filter=>{setView('quiz');window.setTimeout(()=>window.dispatchEvent(new CustomEvent('set-quiz-filter',{detail:filter})),0)}}/>}
              {view==='ai' && <Assistant course={activeCourse}/>}
              {view==='courses' && <Courses courses={courses} activeId={activeCourseId} onSelect={id=>{setActiveCourseId(id);navigate('roadmap')}} onAdd={c=>{setCourses(prev=>[...prev,c]);setActiveCourseId(c.id);navigate('roadmap')}} onDelete={id=>{if(courses.length<=1)return;setCourses(prev=>prev.filter(c=>c.id!==id));if(activeCourseId===id)setActiveCourseId(courses.find(c=>c.id!==id).id)}}/>}
            </div>
          </div>
          <footer className="hidden md:flex shrink-0 px-5 py-2 border-t border-slate-200 bg-white text-[10px] text-slate-500 justify-between"><span>Standalone browser demo · Data saved locally in this browser</span><span>AI and document extraction require backend configuration</span></footer>
        </main>
      </div>;
    }

    function Roadmap({course,questions,attempted,onUpdateCourse,onStartQuiz,onTheory}) {
      const exam = new Date(`${course.examDate}T23:59:59`);
      const days = Math.max(0,Math.ceil((exam-new Date())/86400000));
      const grade = GRADES.find(g=>g.id===course.targetGrade)||GRADES[3];
      const qs = questions.filter(q=>q.courseCode===course.code);
      const done = qs.filter(q=>attempted[q.id]).length;
      const accuracy = done?Math.round(qs.filter(q=>attempted[q.id]?.correct).length/done*100):0;
      return <div className="space-y-5"><section className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm"><div className="grid grid-cols-1 lg:grid-cols-2 gap-5"><div className="space-y-3"><div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold uppercase text-emerald-700 flex items-center gap-2"><Calendar size={15}/> Time Management</span><span className="rounded-full bg-amber-100 text-amber-800 px-3 py-1 text-xs font-bold">{days} days left</span></div><h2 className="text-lg font-black">Your study timeline</h2><label className="block text-[11px] font-bold text-slate-500">Exam date</label><input type="date" value={course.examDate||''} onChange={e=>onUpdateCourse({...course,examDate:e.target.value})} className="w-full sm:max-w-xs border rounded-xl px-3 py-2 text-sm"/><div className="rounded-xl bg-emerald-50 p-3"><div className="flex justify-between text-xs font-bold"><span>Question practice</span><span>{done}/{qs.length} attempted</span></div><div className="h-2 bg-emerald-100 rounded-full mt-2 overflow-hidden"><div className="h-full bg-emerald-600" style={{width:`${qs.length?done/qs.length*100:0}%`}}/></div><p className="text-[11px] text-emerald-800 mt-2">Current accuracy: {accuracy}%</p></div></div><div className="space-y-3"><div className="flex items-center gap-2 text-xs font-extrabold uppercase text-emerald-700"><Sliders size={15}/> Target grade</div><div className="grid grid-cols-5 gap-1.5">{GRADES.map(g=><button key={g.id} onClick={()=>onUpdateCourse({...course,targetGrade:g.id})} className={`rounded-xl py-2 text-xs font-black border ${course.targetGrade===g.id?'bg-emerald-600 text-white border-emerald-600':'bg-slate-50 border-slate-200 text-slate-600'}`}>{g.id}</button>)}</div><p className="text-xs text-slate-600">{grade.desc}</p><div className="flex flex-wrap gap-2 text-[10px] font-bold"><span className="bg-emerald-50 text-emerald-800 rounded-lg px-2 py-1">Basic {grade.weights[0]}%</span><span className="bg-blue-50 text-blue-800 rounded-lg px-2 py-1">Applied {grade.weights[1]}%</span><span className="bg-purple-50 text-purple-800 rounded-lg px-2 py-1">Advanced {grade.weights[2]}%</span></div></div></div></section>
        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3"><div><h2 className="font-black text-lg">Study Roadmap</h2><p className="text-xs text-slate-500">Sessions and topics from the sample Marketing course.</p></div><button onClick={()=>onStartQuiz('ALL')} className="bg-emerald-600 text-white rounded-xl px-4 py-2.5 text-xs font-bold inline-flex items-center justify-center gap-2"><Play size={14}/> Start mixed practice</button></div>
        <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_300px] gap-4"><div className="space-y-3">{(course.sessions||[]).map((s,i)=>{const sq=qs.filter(q=>q.sessionId===s.id);const reviewed=sq.filter(q=>attempted[q.id]).length;return <section key={s.id} className="bg-white border border-slate-200 rounded-2xl p-4"><div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div className="min-w-0"><div className="flex flex-wrap gap-2 items-center mb-1"><span className="bg-emerald-100 text-emerald-800 rounded-md px-2 py-1 text-[10px] font-black">Study block {i+1}</span><span className="text-[10px] text-slate-500 font-bold">{reviewed}/{sq.length} sample questions attempted</span></div><h3 className="text-sm font-extrabold">{s.title}</h3></div><div className="flex gap-2"><button onClick={onTheory} className="border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold">Theory</button><button onClick={()=>onStartQuiz(s.id)} className="bg-slate-900 hover:bg-emerald-700 text-white rounded-lg px-3 py-2 text-xs font-bold inline-flex items-center gap-1">Practice <ChevronRight size={14}/></button></div></div><div className="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-slate-100">{s.topics.map(t=><span key={t} className="rounded-lg bg-slate-100 px-2.5 py-1 text-[10px] text-slate-600">{t}</span>)}</div></section>})}</div><aside className="bg-white border border-slate-200 rounded-2xl p-4 h-fit"><h3 className="font-extrabold text-sm flex items-center gap-2"><ShieldCheck size={17} className="text-emerald-600"/> Sample exam insights</h3><p className="text-[11px] text-slate-500 mt-2">The included questions are illustrative seed data. The frequency labels below are not verified statistical predictions.</p><div className="mt-3 space-y-2"><div className="rounded-xl bg-emerald-50 p-3"><b className="text-xs">Session 1 & 2</b><p className="text-[11px] text-slate-600 mt-1">Marketing process, Marketing Myopia, marketing environment.</p></div><div className="rounded-xl bg-amber-50 p-3"><b className="text-xs">Session 5 & 7–8</b><p className="text-[11px] text-slate-600 mt-1">Research methods and three levels of product.</p></div><div className="rounded-xl bg-blue-50 p-3"><b className="text-xs">Session 9 & 10</b><p className="text-[11px] text-slate-600 mt-1">Pricing strategies, marketing channels and disintermediation.</p></div></div></aside></div></div>;
    }

    function fileCategory(name) {
      const ext=(name.split('.').pop()||'').toLowerCase();
      if(ext==='pdf')return 'PDF'; if(['ppt','pptx','odp'].includes(ext))return 'Presentation'; if(['doc','docx','odt','rtf','txt','md'].includes(ext))return 'Document'; if(['xls','xlsx','csv','ods'].includes(ext))return 'Spreadsheet'; if(['png','jpg','jpeg','webp','tif','tiff','bmp'].includes(ext))return 'Image'; if(['json','xml','yaml','yml'].includes(ext))return 'Data'; if(ext==='zip')return 'Archive'; if(['mp3','wav','m4a','mp4','mov','webm'].includes(ext))return 'Media'; return 'Other';
    }

    function Documents({course,docs,onDocsChange}) {
      const [queue,setQueue]=useState([]); const [drag,setDrag]=useState(false); const [search,setSearch]=useState(''); const [filter,setFilter]=useState('ALL'); const inputRef=useRef(null);
      const addFiles=list=>{const files=Array.from(list||[]);if(!files.length)return;setQueue(prev=>[...prev,...files.map((f,i)=>({id:`${Date.now()}-${Math.random()}-${i}`,file:f,name:f.name,size:f.size,type:fileCategory(f.name),mime:f.type||'Unknown MIME'}))]);};
      const openPicker=e=>{e?.stopPropagation();if(inputRef.current){inputRef.current.value='';inputRef.current.click()}};
      const saveRecords=()=>{const next=queue.map(x=>({id:`local-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name:x.name,sizeBytes:x.size,sizeLabel:formatBytes(x.size),type:x.type,mime:x.mime,status:'Selected locally',analysis:'Not analyzed',addedAt:new Date().toISOString()}));onDocsChange([...next,...docs]);setQueue([])};
      const filtered=docs.filter(d=>(filter==='ALL'||d.type===filter)&&d.name.toLowerCase().includes(search.toLowerCase()));
      return <div className="space-y-5"><div><h2 className="text-xl font-black">Document Library</h2><p className="text-xs text-slate-500 mt-1">Select and manage course files. This standalone HTML demo stores file metadata only; it does not upload file contents to a server or extract their contents.</p></div>
        <section className={`bg-white border-2 border-dashed rounded-2xl p-5 sm:p-7 text-center transition ${drag?'border-emerald-500 bg-emerald-50':'border-slate-300'}`} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={e=>{e.preventDefault();setDrag(false)}} onDrop={e=>{e.preventDefault();setDrag(false);addFiles(e.dataTransfer.files)}}>
          <input ref={inputRef} type="file" multiple className="hidden" onChange={e=>{addFiles(e.target.files);e.target.value=''}} />
          <div className="mx-auto w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center"><UploadCloud size={25}/></div><h3 className="font-extrabold mt-3">Upload course materials</h3><p className="text-xs text-slate-500 mt-1">PDF, PowerPoint, Word, Excel, images, JSON, ZIP, audio and video files.</p>
          <div className="flex flex-col sm:flex-row justify-center gap-2 mt-4"><button onClick={openPicker} className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-4 py-2.5 text-xs font-bold">Choose files</button><span className="text-xs self-center text-slate-400">or drag and drop here</span></div>
        </section>
        {queue.length>0&&<section className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-3"><div className="flex items-center justify-between gap-2"><b className="text-sm text-emerald-900">Selected files ({queue.length})</b><button onClick={()=>setQueue([])} className="text-xs text-red-600 font-bold">Clear selection</button></div>{queue.map(f=><div key={f.id} className="bg-white rounded-xl p-3 flex items-center gap-3"><File size={18} className="text-emerald-600 shrink-0"/><div className="min-w-0 flex-1"><div className="text-xs font-bold truncate">{f.name}</div><div className="text-[10px] text-slate-500">{f.type} · {formatBytes(f.size)}</div></div><IconButton label="Remove file" onClick={()=>setQueue(prev=>prev.filter(x=>x.id!==f.id))} className="p-2 text-slate-400 hover:bg-red-50 hover:text-red-600"><X size={16}/></IconButton></div>)}<div className="flex flex-col sm:flex-row justify-end gap-2"><button onClick={()=>setQueue([])} className="border border-slate-300 rounded-xl px-4 py-2 text-xs font-bold">Cancel</button><button onClick={saveRecords} className="bg-slate-900 text-white rounded-xl px-4 py-2 text-xs font-bold">Add file records locally</button></div><p className="text-[10px] text-emerald-900">Note: file contents are not uploaded or analyzed in this HTML-only version. A backend is required for persistent file storage and PDF/PPTX extraction.</p></section>}
        <section className="bg-white border border-slate-200 rounded-2xl p-4"><div className="flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between mb-3"><div><h3 className="font-extrabold text-sm">Course files ({filtered.length})</h3><p className="text-[10px] text-slate-500">Locally saved file records</p></div><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search files" className="min-w-0 w-full sm:w-44 bg-slate-100 rounded-lg px-3 py-2 text-xs"/><select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-slate-100 rounded-lg px-2 py-2 text-xs"><option value="ALL">All types</option>{['PDF','Presentation','Document','Spreadsheet','Image','Data','Archive','Media','Other'].map(x=><option key={x}>{x}</option>)}</select></div></div>
        {filtered.length===0?<div className="py-8 text-center text-xs text-slate-400">No file records yet.</div>:<div className="space-y-2">{filtered.map(d=><div key={d.id} className="border border-slate-100 rounded-xl p-3 flex items-center gap-3"><FileText size={18} className="text-emerald-600 shrink-0"/><div className="min-w-0 flex-1"><div className="text-xs font-bold truncate">{d.name}</div><div className="text-[10px] text-slate-500">{d.type} · {d.sizeLabel} · {d.analysis}</div></div><button onClick={()=>onDocsChange(docs.filter(x=>x.id!==d.id))} className="p-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600" aria-label="Remove file record"><Trash2 size={15}/></button></div>)}</div>}</section>
      </div>;
    }
    function formatBytes(bytes){if(!bytes)return '0 B';const units=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),3);return `${(bytes/Math.pow(1024,i)).toFixed(i===0?0:1)} ${units[i]}`}

    function Theory(){const [query,setQuery]=useState('');const [open,setOpen]=useState(null);const list=KEYWORDS.filter(k=>(k.term+' '+k.meaningVi+' '+k.session).toLowerCase().includes(query.toLowerCase()));return <div className="space-y-4"><div><h2 className="text-xl font-black">Theory Review</h2><p className="text-xs text-slate-500 mt-1">English academic keywords with Vietnamese explanations.</p></div><div className="relative"><Search size={16} className="absolute left-3 top-3 text-slate-400"/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search keywords, meanings or sessions…" className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-3 py-3 text-sm"/></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-3">{list.map(k=><article key={k.id} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-extrabold text-emerald-800 bg-emerald-50 px-2 py-1 rounded">{k.session}</span><BookMarked size={16} className="text-emerald-600"/></div><h3 className="font-black">{k.term} <span className="text-emerald-700 text-sm font-bold">({k.meaningVi})</span></h3><div className="bg-slate-50 rounded-xl p-3"><b className="text-[10px] uppercase text-slate-500">English definition</b><p className="text-xs mt-1 leading-relaxed">{k.definitionEn}</p></div><p className="text-xs leading-relaxed"><b className="text-emerald-800">Giải thích:</b> {k.explanationVi}</p>{open===k.id&&<div className="rounded-xl bg-emerald-50 p-3 text-xs"><b>Ví dụ:</b> {k.example}</div>}<button onClick={()=>setOpen(open===k.id?null:k.id)} className="text-xs font-bold text-emerald-700">{open===k.id?'Hide example':'Show practical example'}</button></article>)}</div>{list.length===0&&<p className="text-center text-sm text-slate-500 py-8">No matching keywords.</p>}</div>}

    function Quiz({course,questions,attempted,setAttempted,addXp}){
      const [mode,setMode]=useState('fresh');const [filter,setFilter]=useState('ALL');const [index,setIndex]=useState(0);const [answers,setAnswers]=useState({});const [submitted,setSubmitted]=useState({});const [flagged,setFlagged]=useState({});
      const list=useMemo(()=>questions.filter(q=>q.courseCode===course.code&&(filter==='ALL'||q.sessionId===filter)&&(mode==='review'||!attempted[q.id])),[questions,course.code,filter,mode,attempted]);
      useEffect(()=>{setIndex(0);setAnswers({});setSubmitted({});},[mode,filter]);
      useEffect(()=>{const handler=e=>{setFilter(e.detail||'ALL')};window.addEventListener('set-quiz-filter',handler);return()=>window.removeEventListener('set-quiz-filter',handler)},[]);
      const q=list[index];
      const submit=()=>{if(!q||answers[q.id]===undefined)return;const ok=answers[q.id]===q.correctIndex;setSubmitted(prev=>({...prev,[q.id]:true}));setAttempted(prev=>({...prev,[q.id]:{correct:ok,selected:answers[q.id],timestamp:Date.now()}}));addXp(ok?25:5)};
      const doneCount=list.filter(x=>submitted[x.id]||attempted[x.id]).length;
      if(!q)return <div className="max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl p-7 text-center"><Award size={35} className="mx-auto text-emerald-600"/><h2 className="text-lg font-black mt-3">No fresh questions available</h2><p className="text-xs text-slate-500 mt-2">All currently available questions in this selection have been attempted. Switch to Review mode or add a verified question bank.</p><button onClick={()=>setMode('review')} className="mt-4 bg-emerald-600 text-white rounded-xl px-4 py-2 text-xs font-bold">Review questions</button></div>;
      const isDone=!!submitted[q.id]||!!attempted[q.id];
      return <div className="max-w-3xl mx-auto space-y-4"><div className="bg-white border border-slate-200 rounded-2xl p-3 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between"><div className="flex flex-wrap gap-2"><select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-slate-100 rounded-lg px-2 py-2 text-xs font-bold"><option value="ALL">All Sessions</option>{course.sessions.map(s=><option value={s.id} key={s.id}>{s.title}</option>)}</select><div className="flex bg-slate-100 p-1 rounded-lg"><button onClick={()=>setMode('fresh')} className={`px-3 py-1.5 rounded-md text-xs font-bold ${mode==='fresh'?'bg-emerald-600 text-white':'text-slate-600'}`}>Fresh ({questions.filter(x=>x.courseCode===course.code&&!attempted[x.id]&&(filter==='ALL'||x.sessionId===filter)).length})</button><button onClick={()=>setMode('review')} className={`px-3 py-1.5 rounded-md text-xs font-bold ${mode==='review'?'bg-emerald-600 text-white':'text-slate-600'}`}>Review all</button></div></div><span className="text-xs text-slate-500 font-bold">{doneCount}/{list.length} reviewed</span></div>
        <article className="bg-white border-2 border-emerald-500 rounded-2xl p-4 sm:p-6 shadow-sm space-y-5"><div className="flex flex-wrap justify-between gap-2 border-b border-slate-100 pb-3"><div className="flex flex-wrap gap-2"><span className="bg-emerald-100 text-emerald-800 rounded-md px-2 py-1 text-[10px] font-extrabold">{q.sessionTitle}</span><span className="bg-slate-100 text-slate-600 rounded-md px-2 py-1 text-[10px] font-bold">{q.origin}</span></div><span className="text-xs font-bold text-slate-500">Question {index+1} / {list.length}</span></div><div><p className="text-[10px] uppercase tracking-wider text-slate-400 font-bold">{q.topic} · Level {q.difficultyLevel}</p><h2 className="font-extrabold text-base sm:text-lg leading-relaxed mt-2">{q.question}</h2><p className="text-[10px] text-slate-400 mt-2">Source: {q.sourceDoc}</p></div>
        <div className="space-y-2">{q.options.map((option,i)=>{const chosen=answers[q.id]===i;const correct=q.correctIndex===i;let style='border-slate-200 hover:border-emerald-400';if(chosen)style='border-emerald-500 bg-emerald-50';if(isDone&&correct)style='border-emerald-500 bg-emerald-100';if(isDone&&chosen&&!correct)style='border-red-400 bg-red-50';return <button key={i} disabled={isDone} onClick={()=>setAnswers(prev=>({...prev,[q.id]:i}))} className={`w-full text-left border-2 rounded-xl px-3 py-3 text-xs sm:text-sm flex items-center gap-3 ${style}`}><span className="w-6 h-6 rounded-full border flex items-center justify-center shrink-0 font-bold">{String.fromCharCode(65+i)}</span><span className="flex-1">{option}</span>{isDone&&correct&&<CheckCircle2 size={17} className="text-emerald-600"/>}</button>})}</div>
        {isDone&&<div className={`rounded-xl p-4 ${attempted[q.id]?.correct?'bg-emerald-50 border border-emerald-200':'bg-amber-50 border border-amber-200'}`}><div className="flex items-center gap-2 text-sm font-extrabold mb-2">{attempted[q.id]?.correct?<CheckCircle2 size={17} className="text-emerald-600"/>:<AlertCircle size={17} className="text-amber-600"/>}{attempted[q.id]?.correct?'Correct answer':'Review this concept'}</div><p className="text-xs leading-relaxed">{q.explanationVi}</p><p className="text-[10px] text-slate-500 mt-2">Correct answer: {q.options[q.correctIndex]}</p></div>}
        <div className="flex items-center justify-between gap-2 pt-2"><button disabled={index===0} onClick={()=>setIndex(i=>Math.max(0,i-1))} className="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold disabled:opacity-40 inline-flex items-center gap-1"><ChevronLeft size={15}/> Previous</button><button onClick={()=>setFlagged(p=>({...p,[q.id]:!p[q.id]}))} className={`text-xs font-bold px-2 py-2 ${flagged[q.id]?'text-amber-700':'text-slate-500'}`}>{flagged[q.id]?'★ Flagged':'☆ Flag for review'}</button>{!isDone?<button onClick={submit} disabled={answers[q.id]===undefined} className="bg-emerald-600 text-white rounded-xl px-4 py-2 text-xs font-bold disabled:opacity-40">Check answer</button>:<button onClick={()=>setIndex(i=>(i+1)%list.length)} className="bg-slate-900 text-white rounded-xl px-4 py-2 text-xs font-bold inline-flex items-center gap-1">Next <ArrowRight size={14}/></button>}</div>
        <div className="flex flex-wrap gap-1.5 border-t border-slate-100 pt-3">{list.map((item,i)=><button key={item.id} onClick={()=>setIndex(i)} className={`w-8 h-8 rounded-lg text-[11px] font-bold ${i===index?'bg-emerald-700 text-white':submitted[item.id]||attempted[item.id]?'bg-emerald-100 text-emerald-800':'bg-slate-100 text-slate-600'} ${flagged[item.id]?'ring-2 ring-amber-400':''}`}>{i+1}</button>)}</div></article></div>;
    }

    function Analytics({course,questions,attempted,onPractice}){const qs=questions.filter(q=>q.courseCode===course.code);const done=qs.filter(q=>attempted[q.id]);const right=done.filter(q=>attempted[q.id].correct).length;const accuracy=done.length?Math.round(right/done.length*100):0;return <div className="space-y-4"><div><h2 className="text-xl font-black">Progress & Analytics</h2><p className="text-xs text-slate-500 mt-1">Practice statistics from this browser.</p></div><div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><Stat title="Attempted" value={`${done.length}/${qs.length}`} sub="Available sample questions"/><Stat title="Accuracy" value={`${accuracy}%`} sub={`${right} correct answers`}/><Stat title="Preparation status" value={accuracy>=80&&done.length>=5?'Strong practice':done.length?'In progress':'Not started'} sub="Not an official grade prediction"/></div><section className="bg-white border border-slate-200 rounded-2xl p-4"><h3 className="font-extrabold text-sm mb-3">Session practice coverage</h3><div className="space-y-4">{course.sessions.map(s=>{const sq=qs.filter(q=>q.sessionId===s.id);const finished=sq.filter(q=>attempted[q.id]);const pct=sq.length?Math.round(finished.length/sq.length*100):0;return <div key={s.id}><div className="flex items-center justify-between gap-2 text-xs mb-1"><b>{s.title}</b><span className="text-slate-500">{finished.length}/{sq.length}</span></div><div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-emerald-600" style={{width:`${pct}%`}}/></div><button onClick={()=>onPractice(s.id)} className="text-[10px] text-emerald-700 font-bold mt-1">Practice this session</button></div>})}</div></section></div>}
    function Stat({title,value,sub}){return <div className="bg-white border border-slate-200 rounded-2xl p-4"><div className="text-[10px] uppercase text-slate-400 font-extrabold">{title}</div><div className="text-2xl font-black mt-1">{value}</div><div className="text-[10px] text-slate-500 mt-1">{sub}</div></div>}

    function Assistant({course}){const [input,setInput]=useState('');const [messages,setMessages]=useState([{role:'model',text:`Chào bạn! Đây là trợ lý học tập demo cho môn ${course.name}. Gemini/OpenAI API chưa được cấu hình trong file HTML này. Bạn vẫn có thể xem các gợi ý mẫu về những chủ đề Marketing có sẵn.`}]);const [busy,setBusy]=useState(false);const send=(value=input)=>{const text=value.trim();if(!text||busy)return;setMessages(prev=>[...prev,{role:'user',text}]);setInput('');setBusy(true);setTimeout(()=>{let answer='Bản HTML hiện chưa kết nối Gemini hoặc OpenAI. Hãy cấu hình API qua backend an toàn để nhận giải thích dựa trên tài liệu môn học. Với dữ liệu mẫu, bạn có thể xem Theory Review để ôn thuật ngữ.';const q=text.toLowerCase();if(q.includes('disintermediation'))answer='Disintermediation (loại bỏ hoặc thay thế trung gian) là việc nhà sản xuất cắt bỏ trung gian truyền thống hoặc nền tảng mới thay thế trung gian cũ. Ví dụ trong Session 10 là các nền tảng số làm thay đổi kênh phân phối truyền thống.';else if(q.includes('segmented pricing'))answer='Segmented pricing (định giá phân khúc) là bán cùng một sản phẩm/dịch vụ ở nhiều mức giá, trong đó chênh lệch không xuất phát từ chênh lệch chi phí. Ví dụ: giá vé sinh viên và người lớn.';else if(q.includes('myopia'))answer='Marketing Myopia là việc doanh nghiệp tập trung quá mức vào sản phẩm hiện tại và quên nhu cầu, lợi ích, trải nghiệm thật sự của khách hàng.';setMessages(prev=>[...prev,{role:'model',text:answer}]);setBusy(false)},450)};return <div className="max-w-4xl mx-auto h-[min(75vh,760px)] min-h-[480px] flex flex-col bg-white border border-slate-200 rounded-2xl overflow-hidden"><div className="bg-emerald-900 text-white p-4 flex items-center gap-3"><Bot className="text-emerald-300"/><div><h2 className="font-extrabold text-sm">AI Study Assistant</h2><p className="text-[10px] text-emerald-200">Demo responses · No live AI API configured</p></div></div><div className="p-2 bg-emerald-50 flex flex-wrap gap-2">{['Explain Marketing Myopia','Explain Segmented Pricing','Explain Disintermediation'].map(t=><button key={t} onClick={()=>send(t)} className="bg-white border border-emerald-200 text-emerald-800 rounded-lg px-2.5 py-1.5 text-[10px] font-bold">{t}</button>)}</div><div className="flex-1 overflow-y-auto bg-slate-50 p-3 sm:p-4 space-y-3">{messages.map((m,i)=><div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[90%] sm:max-w-[80%] p-3 rounded-2xl text-xs leading-relaxed whitespace-pre-wrap ${m.role==='user'?'bg-emerald-600 text-white':'bg-white border border-slate-200'}`}>{m.text}</div></div>)}{busy&&<p className="text-xs text-slate-400">Preparing demo response…</p>}</div><form onSubmit={e=>{e.preventDefault();send()}} className="border-t border-slate-200 p-3 flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask about a Marketing concept…" className="flex-1 min-w-0 rounded-xl bg-slate-100 px-3 py-2.5 text-xs"/><button disabled={busy} className="bg-emerald-600 text-white rounded-xl px-4"><Send size={16}/></button></form></div>}

    function Courses({courses,activeId,onSelect,onAdd,onDelete}){const [show,setShow]=useState(false);const [form,setForm]=useState({university:'',faculty:'',code:'',name:'',examDate:'',targetGrade:'B'});const create=e=>{e.preventDefault();onAdd({...form,id:`course-${Date.now()}`,sessions:[],documents:[]});setShow(false);setForm({university:'',faculty:'',code:'',name:'',examDate:'',targetGrade:'B'})};return <div className="space-y-4"><div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3"><div><h2 className="text-xl font-black">My Courses</h2><p className="text-xs text-slate-500">Manage independent course workspaces.</p></div><button onClick={()=>setShow(true)} className="bg-emerald-600 text-white rounded-xl px-4 py-2.5 text-xs font-bold inline-flex items-center justify-center gap-2"><Plus size={15}/> Add course</button></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-3">{courses.map(c=><article key={c.id} className={`bg-white border-2 rounded-2xl p-4 ${c.id===activeId?'border-emerald-500':'border-slate-200'}`}><div className="flex items-center justify-between"><span className="bg-emerald-50 text-emerald-800 rounded px-2 py-1 text-[10px] font-extrabold">{c.code}</span><span className="text-xs text-slate-500">Goal: {c.targetGrade}</span></div><h3 className="font-extrabold mt-2">{c.name}</h3><p className="text-[11px] text-slate-500 mt-1">{c.university||'University not set'} · Exam: {c.examDate||'Not set'}</p><p className="text-[11px] text-emerald-700 font-bold mt-3">{c.sessions?.length||0} Sessions · {c.documents?.length||0} documents</p><div className="flex justify-between items-center mt-4 pt-3 border-t"><button onClick={()=>onSelect(c.id)} className="bg-slate-900 text-white rounded-lg px-3 py-2 text-xs font-bold">Open course</button>{courses.length>1&&<button onClick={()=>onDelete(c.id)} className="text-red-500 p-2" aria-label="Delete course"><Trash2 size={16}/></button>}</div></article>)}</div>{show&&<div className="fixed inset-0 z-50 bg-black/50 p-3 flex items-center justify-center"><form onSubmit={create} className="bg-white rounded-2xl p-5 w-full max-w-md space-y-3"><div className="flex justify-between"><h3 className="font-black">Create course</h3><button type="button" onClick={()=>setShow(false)}><X size={18}/></button></div>{[['name','Course name'],['code','Course code'],['university','University'],['faculty','Faculty']].map(([key,label])=><label key={key} className="block text-xs font-bold">{label}<input required={key==='name'||key==='code'} value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm"/></label>)}<label className="block text-xs font-bold">Exam date<input type="date" value={form.examDate} onChange={e=>setForm({...form,examDate:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1"/></label><label className="block text-xs font-bold">Target grade<select value={form.targetGrade} onChange={e=>setForm({...form,targetGrade:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1">{GRADES.map(g=><option key={g.id}>{g.id}</option>)}</select></label><div className="flex justify-end gap-2"><button type="button" onClick={()=>setShow(false)} className="px-3 py-2 rounded-lg bg-slate-100 text-xs font-bold">Cancel</button><button className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold">Create</button></div></form></div>}</div>}

    createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
