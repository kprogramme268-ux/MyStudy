    function readSaved(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):null}catch{return null}}
    function formatBytes(bytes){if(!bytes)return '0 B';const units=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),3);return `${(bytes/Math.pow(1024,i)).toFixed(i===0?0:1)} ${units[i]}`}
    function openFileDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('Trình duyệt không hỗ trợ IndexedDB.'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Không mở được kho lưu file.'))})}
    async function saveFileToDb(record){const db=await openFileDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(record);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('Không lưu được file.'))}})}
    async function getFileFromDb(id){const db=await openFileDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
    async function deleteFileFromDb(id){const db=await openFileDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

    function detectCategory(name){const ext=(name.split('.').pop()||'').toLowerCase();if(ext==='pdf')return 'PDF';if(['ppt','pptx','odp'].includes(ext))return 'Presentation';if(['doc','docx','odt','rtf','txt','md'].includes(ext))return 'Document';if(['xls','xlsx','csv','ods'].includes(ext))return 'Spreadsheet';if(['png','jpg','jpeg','webp','tif','tiff','bmp'].includes(ext))return 'Image';if(['json','xml','yaml','yml'].includes(ext))return 'Data';if(ext==='zip')return 'Archive';if(['mp3','wav','m4a','mp4','mov','webm'].includes(ext))return 'Media';return 'Other'}
    async function extractFile(file){
      const ext=(file.name.split('.').pop()||'').toLowerCase();const result={text:'',sections:[],pageCount:null,slideCount:null,sheets:[],method:'',warnings:[]};
      if(ext==='pdf'){
        if(!window.pdfjsLib)throw new Error('PDF parser chưa tải được. Kiểm tra Internet rồi tải lại trang.');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;result.pageCount=pdf.numPages;result.method='PDF text extraction';
        for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const content=await page.getTextContent();const text=content.items.map(x=>x.str||'').join(' ').replace(/\s+/g,' ').trim();result.sections.push({label:`Page ${n}`,text});}
        result.text=result.sections.map(x=>`${x.label}\n${x.text}`).join('\n\n');if(!result.text.trim())result.warnings.push('PDF không có lớp text đọc được; có thể đây là PDF scan và cần OCR.');return result;
      }
      if(ext==='pptx'||ext==='odp'){
        if(!window.JSZip)throw new Error('Thư viện đọc slide chưa tải được. Kiểm tra Internet rồi tải lại trang.');
        const zip=await JSZip.loadAsync(await file.arrayBuffer());const prefix=ext==='pptx'?'ppt/slides/slide':'content.xml';
        if(ext==='pptx'){
          const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>Number(a.match(/slide(\d+)/)[1])-Number(b.match(/slide(\d+)/)[1]));
          result.slideCount=names.length;result.method='PPTX slide text extraction';
          for(let i=0;i<names.length;i++){const xml=await zip.file(names[i]).async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');const text=Array.from(doc.getElementsByTagNameNS('*','t')).map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();result.sections.push({label:`Slide ${i+1}`,text});}
          const notes=Object.keys(zip.files).filter(n=>/^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n));if(notes.length)result.warnings.push(`Tìm thấy ${notes.length} file speaker notes; bản đọc nhanh hiện ưu tiên nội dung slide.`);
        }else{const xml=await zip.file('content.xml').async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');const text=Array.from(doc.getElementsByTagNameNS('*','p')).map(n=>n.textContent).join('\n');result.sections=[{label:'Presentation content',text}];result.slideCount=null;result.method='ODP text extraction';}
        result.text=result.sections.map(x=>`${x.label}\n${x.text}`).join('\n\n');if(!result.text.trim())result.warnings.push('Không tìm thấy văn bản trong slide. Các nội dung nằm trong ảnh cần OCR/Vision.');return result;
      }
      if(ext==='docx'){
        if(!window.mammoth)throw new Error('Thư viện đọc DOCX chưa tải được. Kiểm tra Internet rồi tải lại trang.');const out=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});result.text=out.value||'';result.sections=[{label:'Document text',text:result.text}];result.method='DOCX text extraction';if(out.messages?.length)result.warnings=out.messages.map(x=>x.message);return result;
      }
      if(ext==='xlsx'||ext==='xls'){
        if(!window.XLSX)throw new Error('Thư viện đọc bảng tính chưa tải được. Kiểm tra Internet rồi tải lại trang.');const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});result.sheets=wb.SheetNames;result.method='Spreadsheet extraction';result.sections=wb.SheetNames.map(name=>({label:`Sheet: ${name}`,text:window.XLSX.utils.sheet_to_csv(wb.Sheets[name])}));result.text=result.sections.map(x=>`${x.label}\n${x.text}`).join('\n\n');return result;
      }
      if(['txt','md','csv','json','xml','yaml','yml','rtf','html'].includes(ext)){
        result.text=await file.text();result.sections=[{label:'File content',text:result.text}];result.method='Text extraction';if(ext==='json'){try{JSON.parse(result.text)}catch{result.warnings.push('File có đuôi JSON nhưng nội dung không phải JSON hợp lệ.')}}return result;
      }
      if(ext==='zip'){
        if(!window.JSZip)throw new Error('Thư viện ZIP chưa tải được.');const zip=await window.JSZip.loadAsync(await file.arrayBuffer());const names=Object.keys(zip.files).filter(n=>!zip.files[n].dir);result.text=names.join('\n');result.sections=[{label:'Archive entries',text:result.text}];result.method='ZIP inventory';result.warnings.push('Đã liệt kê file trong ZIP; cần mở từng tài liệu được hỗ trợ để trích xuất nội dung.');return result;
      }
      result.method='Stored without text extraction';result.warnings.push('Định dạng này được lưu trong trình duyệt nhưng chưa có bộ đọc nội dung tích hợp.');return result;
    }

    function IconButton({children,onClick,label,className=''}){return <button type="button" aria-label={label} title={label} onClick={onClick} className={`inline-flex items-center justify-center rounded-lg transition ${className}`}>{children}</button>}
    function NavButton({icon:Icon,label,active,onClick,badge}){return <button type="button" onClick={onClick} className={`w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-left text-xs font-bold transition ${active?'bg-emerald-600 text-white shadow-sm':'text-slate-600 hover:bg-slate-100'}`}><span className="flex items-center gap-3 min-w-0"><Icon size={16}/><span className="truncate">{label}</span></span>{badge&&<span className={`text-[10px] rounded-full px-2 py-0.5 ${active?'bg-emerald-800 text-white':'bg-slate-100 text-slate-600'}`}>{badge}</span>}</button>}

    function App(){
      const saved=useMemo(()=>readSaved(),[]);const [courses,setCourses]=useState(saved?.courses||[DEFAULT_COURSE]);const [activeCourseId,setActiveCourseId]=useState(saved?.activeCourseId||DEFAULT_COURSE.id);const [questions]=useState(INITIAL_QUESTIONS);const [attempted,setAttempted]=useState(saved?.attempted||{});const [documents,setDocuments]=useState(saved?.documents||{});const [xp,setXp]=useState(saved?.xp??350);const [view,setView]=useState('roadmap');const [mobileMenu,setMobileMenu]=useState(false);
      const activeCourse=courses.find(c=>c.id===activeCourseId)||courses[0];
      useEffect(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify({courses,activeCourseId,attempted,documents,xp}))}catch(e){console.warn('Local storage quota reached',e)}},[courses,activeCourseId,attempted,documents,xp]);
      const updateCourse=updated=>setCourses(prev=>prev.map(c=>c.id===updated.id?updated:c));const navigate=next=>{setView(next);setMobileMenu(false)};
      const nav=[ [MapIcon,'Study Roadmap','roadmap'],[Play,'Practice Quiz','quiz'],[BookOpen,'Theory Review','theory'],[UploadCloud,'Document Library','documents'],[BarChart2,'Analytics','analytics'],[Bot,'AI Study Assistant','ai'],[Layers,'All Courses','courses'] ];
      return <div className="min-h-screen md:h-screen w-full flex flex-col md:flex-row bg-slate-50 text-slate-800 overflow-hidden">
        <header className="md:hidden h-14 shrink-0 bg-emerald-900 text-white px-3 flex items-center justify-between shadow z-30"><div className="flex items-center gap-2 min-w-0"><GraduationCap size={22}/><div className="min-w-0"><div className="font-extrabold text-sm">University Exam Prep</div><div className="text-[10px] text-emerald-200 truncate max-w-[190px]">{activeCourse?.name}</div></div></div><div className="flex items-center gap-2"><span className="text-[11px] font-bold text-amber-300">⚡ {xp} XP</span><IconButton label="Open menu" onClick={()=>setMobileMenu(v=>!v)} className="p-2 hover:bg-emerald-800">{mobileMenu?<X size={20}/>:<Menu size={20}/>}</IconButton></div></header>
        {mobileMenu&&<button aria-label="Close navigation" className="fixed inset-0 top-14 bg-black/40 z-30 md:hidden" onClick={()=>setMobileMenu(false)}/>}
        <aside className={`${mobileMenu?'fixed top-14 bottom-0 left-0 z-40 flex':'hidden'} md:static md:flex md:w-64 md:shrink-0 bg-white border-r border-slate-200 flex-col w-[min(82vw,300px)]`}><div className="hidden md:flex items-center gap-3 px-5 py-5 border-b border-slate-100"><div className="p-2.5 rounded-xl bg-emerald-600 text-white"><GraduationCap size={22}/></div><div><div className="font-black text-sm text-slate-900">University Exam Prep</div><div className="text-[10px] text-emerald-700 font-bold">LOCAL LEARNING WORKSPACE</div></div></div>
          <div className="p-3 bg-emerald-50 border-b border-emerald-100"><div className="flex justify-between items-center mb-1"><label className="text-[10px] uppercase tracking-wider font-extrabold text-emerald-800">Active Course</label><button onClick={()=>navigate('courses')} className="text-[10px] font-bold text-emerald-700">Switch</button></div><select aria-label="Active course" value={activeCourseId} onChange={e=>setActiveCourseId(e.target.value)} className="w-full bg-white border border-emerald-200 rounded-lg px-2 py-2 text-xs font-bold">{courses.map(c=><option key={c.id} value={c.id}>{c.code}: {c.name}</option>)}</select></div>
          <nav className="p-3 space-y-1 flex-1 overflow-y-auto">{nav.map(([Icon,label,key])=><NavButton key={key} icon={Icon} label={label} active={view===key} onClick={()=>navigate(key)} badge={key==='documents'?(documents[activeCourseId]||[]).length:undefined}/>)}</nav><div className="p-4 border-t border-slate-100 flex justify-between text-xs font-bold"><span className="text-orange-600 flex items-center gap-1"><Flame size={15}/> Study streak</span><span className="text-emerald-700 flex items-center gap-1"><Zap size={15}/> {xp} XP</span></div></aside>
        <main className="flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden"><div className="hidden md:flex bg-white border-b border-slate-200 px-6 py-3 items-center justify-between shrink-0"><div className="min-w-0"><div className="flex items-center gap-2"><span className="text-[10px] font-extrabold bg-emerald-100 text-emerald-800 rounded px-2 py-1">{activeCourse?.code}</span><h1 className="font-extrabold text-sm truncate">{activeCourse?.name}</h1></div><p className="text-[11px] text-slate-500 mt-1">{activeCourse?.university} · {activeCourse?.faculty}</p></div><div className="flex items-center gap-2 text-xs font-bold"><span className="rounded-lg bg-slate-100 px-3 py-2">Goal: {activeCourse?.targetGrade}</span><span className="rounded-lg bg-emerald-50 text-emerald-800 px-3 py-2">Exam: {activeCourse?.examDate||'Not set'}</span></div></div>
          <div className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 scrollbar-thin"><div className="max-w-6xl mx-auto fade-in" key={view}>
            {view==='roadmap'&&<Roadmap course={activeCourse} questions={questions} attempted={attempted} onUpdateCourse={updateCourse} onStartQuiz={filter=>{window.sessionStorage.setItem('uep-next-filter',filter);navigate('quiz')}} onTheory={()=>navigate('theory')}/>}
            {view==='documents'&&<Documents course={activeCourse} docs={documents[activeCourseId]||[]} onDocsChange={next=>setDocuments(prev=>({...prev,[activeCourseId]:next}))}/>}
            {view==='theory'&&<Theory/>}
            {view==='quiz'&&<Quiz key={activeCourseId} course={activeCourse} questions={questions} attempted={attempted} setAttempted={setAttempted} addXp={n=>setXp(v=>v+n)}/>}
            {view==='analytics'&&<Analytics course={activeCourse} questions={questions} attempted={attempted} onPractice={filter=>{window.sessionStorage.setItem('uep-next-filter',filter);navigate('quiz')}}/>}
            {view==='ai'&&<Assistant course={activeCourse}/>}
            {view==='courses'&&<Courses courses={courses} activeId={activeCourseId} onSelect={id=>{setActiveCourseId(id);navigate('roadmap')}} onAdd={c=>{setCourses(prev=>[...prev,c]);setActiveCourseId(c.id);navigate('roadmap')}} onDelete={id=>{if(courses.length<=1)return;const remaining=courses.filter(c=>c.id!==id);setCourses(remaining);if(activeCourseId===id)setActiveCourseId(remaining[0].id)}}/>}
          </div></div><footer className="hidden md:flex shrink-0 px-5 py-2 border-t border-slate-200 bg-white text-[10px] text-slate-500 justify-between"><span>Standalone browser app · Study data saved locally</span><span>AI answers require a secure backend and API configuration</span></footer></main>
      </div>
    }

    function Roadmap({course,questions,attempted,onUpdateCourse,onStartQuiz,onTheory}){const exam=course.examDate?new Date(`${course.examDate}T23:59:59`):null;const days=exam?Math.max(0,Math.ceil((exam-new Date())/86400000)):null;const grade=GRADES.find(g=>g.id===course.targetGrade)||GRADES[3];const qs=questions.filter(q=>q.courseCode===course.code);const done=qs.filter(q=>attempted[q.id]).length;const accuracy=done?Math.round(qs.filter(q=>attempted[q.id]?.correct).length/done*100):0;
      return <div className="space-y-5"><section className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm"><div className="grid grid-cols-1 lg:grid-cols-2 gap-5"><div className="space-y-3"><div className="flex items-center justify-between gap-2"><span className="text-xs font-extrabold uppercase text-emerald-700 flex items-center gap-2"><Calendar size={15}/> Time Management</span><span className="rounded-full bg-amber-100 text-amber-800 px-3 py-1 text-xs font-bold">{days===null?'Set exam date':`${days} days left`}</span></div><h2 className="text-lg font-black">Your study timeline</h2><label className="block text-[11px] font-bold text-slate-500">Exam date</label><input type="date" value={course.examDate||''} onChange={e=>onUpdateCourse({...course,examDate:e.target.value})} className="w-full sm:max-w-xs border rounded-xl px-3 py-2 text-sm"/><div className="rounded-xl bg-emerald-50 p-3"><div className="flex justify-between text-xs font-bold"><span>Question practice</span><span>{done}/{qs.length} attempted</span></div><div className="h-2 bg-emerald-100 rounded-full mt-2 overflow-hidden"><div className="h-full bg-emerald-600" style={{width:`${qs.length?done/qs.length*100:0}%`}}/></div><p className="text-[11px] text-emerald-800 mt-2">Current accuracy: {accuracy}% (practice data only)</p></div></div><div className="space-y-3"><div className="flex items-center gap-2 text-xs font-extrabold uppercase text-emerald-700"><Sliders size={15}/> Target grade</div><div className="grid grid-cols-5 gap-1.5">{GRADES.map(g=><button key={g.id} onClick={()=>onUpdateCourse({...course,targetGrade:g.id})} className={`rounded-xl py-2 text-xs font-black border ${course.targetGrade===g.id?'bg-emerald-600 text-white border-emerald-600':'bg-slate-50 border-slate-200 text-slate-600'}`}>{g.id}</button>)}</div><p className="text-xs text-slate-600">{grade.desc}</p><div className="flex flex-wrap gap-2 text-[10px] font-bold"><span className="bg-emerald-50 text-emerald-800 rounded-lg px-2 py-1">Basic {grade.weights[0]}%</span><span className="bg-blue-50 text-blue-800 rounded-lg px-2 py-1">Applied {grade.weights[1]}%</span><span className="bg-purple-50 text-purple-800 rounded-lg px-2 py-1">Advanced {grade.weights[2]}%</span></div></div></div></section>
      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3"><div><h2 className="font-black text-lg">Study Roadmap</h2><p className="text-xs text-slate-500">Sessions and topics from the sample Marketing course.</p></div><button onClick={()=>onStartQuiz('ALL')} className="bg-emerald-600 text-white rounded-xl px-4 py-2.5 text-xs font-bold inline-flex items-center justify-center gap-2"><Play size={14}/> Start mixed practice</button></div>
      <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_300px] gap-4"><div className="space-y-3">{(course.sessions||[]).map((s,i)=>{const sq=qs.filter(q=>q.sessionId===s.id);const reviewed=sq.filter(q=>attempted[q.id]).length;return <section key={s.id} className="bg-white border border-slate-200 rounded-2xl p-4"><div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div className="min-w-0"><div className="flex flex-wrap gap-2 items-center mb-1"><span className="bg-emerald-100 text-emerald-800 rounded-md px-2 py-1 text-[10px] font-black">Study block {i+1}</span><span className="text-[10px] text-slate-500 font-bold">{reviewed}/{sq.length} sample questions attempted</span></div><h3 className="text-sm font-extrabold">{s.title}</h3></div><div className="flex gap-2"><button onClick={onTheory} className="border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold">Theory</button><button onClick={()=>onStartQuiz(s.id)} className="bg-slate-900 hover:bg-emerald-700 text-white rounded-lg px-3 py-2 text-xs font-bold inline-flex items-center gap-1">Practice <ChevronRight size={14}/></button></div></div><div className="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-slate-100">{s.topics.map(t=><span key={t} className="rounded-lg bg-slate-100 px-2.5 py-1 text-[10px] text-slate-600">{t}</span>)}</div></section>})}</div><aside className="bg-white border border-slate-200 rounded-2xl p-4 h-fit"><h3 className="font-extrabold text-sm flex items-center gap-2"><ShieldCheck size={17} className="text-emerald-600"/> Exam insights</h3><p className="text-[11px] text-slate-500 mt-2">These are illustrative course notes, not verified predictions of a future examination.</p><div className="mt-3 space-y-2"><div className="rounded-xl bg-emerald-50 p-3"><b className="text-xs">Session 1 & 2</b><p className="text-[11px] text-slate-600 mt-1">Marketing process, Marketing Myopia, marketing environment.</p></div><div className="rounded-xl bg-amber-50 p-3"><b className="text-xs">Session 5 & 7–8</b><p className="text-[11px] text-slate-600 mt-1">Research methods and three levels of product.</p></div><div className="rounded-xl bg-blue-50 p-3"><b className="text-xs">Session 9 & 10</b><p className="text-[11px] text-slate-600 mt-1">Pricing strategies, marketing channels and disintermediation.</p></div></div></aside></div></div>
    }

    function Documents({course,docs,onDocsChange}){
      const [queue,setQueue]=useState([]);const [drag,setDrag]=useState(false);const [search,setSearch]=useState('');const [filter,setFilter]=useState('ALL');const [processing,setProcessing]=useState(false);const [progress,setProgress]=useState({});const [preview,setPreview]=useState(null);const [notice,setNotice]=useState('');const inputRef=useRef(null);
      const addFiles=list=>{const files=Array.from(list||[]);if(!files.length)return;setQueue(prev=>[...prev,...files.map((f,i)=>({id:`${Date.now()}-${Math.random()}-${i}`,file:f,name:f.name,size:f.size,type:detectCategory(f.name)}))]);setNotice('')};
      const openPicker=e=>{e?.stopPropagation();if(inputRef.current){inputRef.current.value='';inputRef.current.click()}};
      const processQueue=async()=>{if(!queue.length||processing)return;setProcessing(true);setNotice('');const completed=[];for(let i=0;i<queue.length;i++){const item=queue[i];setProgress(p=>({...p,[item.id]:'Reading file…'}));let extraction=null;let status='Stored';let error='';try{extraction=await extractFile(item.file);status=extraction.text.trim()?'Extracted':'Stored - no text extracted';}catch(err){status='Stored - extraction failed';error=err.message||'Unknown extraction error';}const id=`file-${Date.now()}-${i}-${Math.random().toString(36).slice(2,7)}`;const record={id,name:item.name,sizeBytes:item.size,sizeLabel:formatBytes(item.size),type:item.type,mime:item.file.type||'Unknown MIME',status,analysis:extraction?.method||'Not analyzed',pageCount:extraction?.pageCount??null,slideCount:extraction?.slideCount??null,sectionCount:extraction?.sections?.length||0,excerpt:(extraction?.text||'').slice(0,500),warnings:extraction?.warnings||[],error,addedAt:new Date().toISOString()};try{await saveFileToDb({id,blob:item.file,extraction,metadata:record});}catch(dbErr){record.error=[record.error,dbErr.message].filter(Boolean).join(' | ');record.status='Storage failed';}completed.push(record);setProgress(p=>({...p,[item.id]:'Completed'}));}onDocsChange([...completed,...docs]);setQueue([]);setProcessing(false);setProgress({});setNotice(`Đã xử lý ${completed.length} file. Kiểm tra trạng thái từng file bên dưới.`)};
      const removeDoc=async d=>{try{await deleteFileFromDb(d.id)}catch(e){console.warn(e)}onDocsChange(docs.filter(x=>x.id!==d.id));if(preview?.id===d.id)setPreview(null)};
      const openPreview=async d=>{setPreview({loading:true,doc:d});try{const saved=await getFileFromDb(d.id);setPreview({loading:false,doc:d,extraction:saved?.extraction||null})}catch(e){setPreview({loading:false,doc:d,error:e.message})}};
      const filtered=docs.filter(d=>(filter==='ALL'||d.type===filter)&&d.name.toLowerCase().includes(search.toLowerCase()));
      return <div className="space-y-5"><div><h2 className="text-xl font-black">Document Library</h2><p className="text-xs text-slate-500 mt-1">Chọn file để trích xuất nội dung trực tiếp trong trình duyệt. File và kết quả được lưu cục bộ bằng IndexedDB trên thiết bị này.</p></div>
        <section className={`bg-white border-2 border-dashed rounded-2xl p-5 sm:p-7 text-center transition ${drag?'border-emerald-500 bg-emerald-50':'border-slate-300'}`} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={e=>{e.preventDefault();setDrag(false)}} onDrop={e=>{e.preventDefault();setDrag(false);addFiles(e.dataTransfer.files)}}><input ref={inputRef} type="file" multiple className="hidden" onChange={e=>{addFiles(e.target.files);e.target.value=''}}/><div className="mx-auto w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center"><UploadCloud size={25}/></div><h3 className="font-extrabold mt-3">Upload course materials</h3><p className="text-xs text-slate-500 mt-1">PDF, PPTX, DOCX, XLSX, CSV, text, JSON, ZIP and images.</p><div className="flex flex-col sm:flex-row justify-center gap-2 mt-4"><button type="button" onClick={openPicker} className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-4 py-2.5 text-xs font-bold">Choose files</button><span className="text-xs self-center text-slate-400">or drag and drop here</span></div></section>
        {queue.length>0&&<section className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-3"><div className="flex items-center justify-between gap-2"><b className="text-sm text-emerald-900">Selected files ({queue.length})</b><button disabled={processing} onClick={()=>setQueue([])} className="text-xs text-red-600 font-bold disabled:opacity-40">Clear selection</button></div>{queue.map(f=><div key={f.id} className="bg-white rounded-xl p-3 flex items-center gap-3"><File size={18} className="text-emerald-600 shrink-0"/><div className="min-w-0 flex-1"><div className="text-xs font-bold truncate">{f.name}</div><div className="text-[10px] text-slate-500">{f.type} · {formatBytes(f.size)} · {progress[f.id]||'Ready'}</div></div><IconButton label="Remove selected file" onClick={()=>setQueue(prev=>prev.filter(x=>x.id!==f.id))} className="p-2 text-slate-400 hover:bg-red-50 hover:text-red-600"><X size={16}/></IconButton></div>)}<div className="flex justify-end"><button disabled={processing} onClick={processQueue} className="bg-slate-900 text-white rounded-xl px-4 py-2.5 text-xs font-bold disabled:opacity-50">{processing?'Processing…':'Upload & extract content'}</button></div><p className="text-[10px] text-emerald-900">PDF, PPTX, DOCX and spreadsheets are parsed when their browser libraries load. Image OCR and AI semantic analysis are not included in this standalone file.</p></section>}
        {notice&&<div className="rounded-xl bg-emerald-50 text-emerald-900 border border-emerald-200 px-3 py-2 text-xs">{notice}</div>}
        <section className="bg-white border border-slate-200 rounded-2xl p-4"><div className="flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between mb-3"><div><h3 className="font-extrabold text-sm">Course files ({filtered.length})</h3><p className="text-[10px] text-slate-500">Stored in this browser, not uploaded to a public server</p></div><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search files" className="min-w-0 w-full sm:w-44 bg-slate-100 rounded-lg px-3 py-2 text-xs"/><select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-slate-100 rounded-lg px-2 py-2 text-xs"><option value="ALL">All types</option>{['PDF','Presentation','Document','Spreadsheet','Image','Data','Archive','Media','Other'].map(x=><option key={x}>{x}</option>)}</select></div></div>
        {filtered.length===0?<div className="py-8 text-center text-xs text-slate-400">No files yet. Choose files above to begin.</div>:<div className="space-y-2">{filtered.map(d=><div key={d.id} className="border border-slate-100 rounded-xl p-3 flex flex-wrap items-center gap-3"><FileText size={18} className="text-emerald-600 shrink-0"/><div className="min-w-0 flex-1"><div className="text-xs font-bold break-words">{d.name}</div><div className="text-[10px] text-slate-500">{d.type} · {d.sizeLabel} · {d.analysis} · {d.status}</div>{d.pageCount&&<div className="text-[10px] text-slate-500">{d.pageCount} PDF pages</div>}{d.slideCount!==null&&d.slideCount!==undefined&&<div className="text-[10px] text-slate-500">{d.slideCount} slides</div>}{d.error&&<div className="text-[10px] text-red-600">{d.error}</div>}</div><div className="flex items-center gap-1"><button onClick={()=>openPreview(d)} className="px-2.5 py-2 rounded-lg bg-emerald-50 text-emerald-800 text-[11px] font-bold">View extracted text</button><button onClick={()=>removeDoc(d)} className="p-2 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600" aria-label="Delete stored file"><Trash2 size={15}/></button></div></div>)}</div>}</section>
        {preview&&<div className="fixed inset-0 z-50 bg-black/60 p-3 flex items-center justify-center" role="dialog" aria-modal="true"><div className="bg-white rounded-2xl p-4 sm:p-6 w-full max-w-3xl max-h-[88vh] overflow-y-auto space-y-4"><div className="flex items-start justify-between gap-3 border-b pb-3"><div className="min-w-0"><span className="text-[10px] font-bold text-emerald-800">{preview.doc?.type} · {preview.doc?.status}</span><h3 className="font-black text-sm sm:text-base break-words">{preview.doc?.name}</h3></div><button onClick={()=>setPreview(null)} className="p-2 rounded-lg hover:bg-slate-100"><X size={18}/></button></div>{preview.loading?<p className="text-sm text-slate-500">Loading extracted content…</p>:preview.error?<p className="text-sm text-red-600">{preview.error}</p>:preview.extraction?<><div className="flex flex-wrap gap-2 text-[10px] text-slate-600"><span className="bg-slate-100 rounded px-2 py-1">Method: {preview.extraction.method}</span>{preview.extraction.pageCount&&<span className="bg-slate-100 rounded px-2 py-1">Pages: {preview.extraction.pageCount}</span>}{preview.extraction.slideCount!==null&&preview.extraction.slideCount!==undefined&&<span className="bg-slate-100 rounded px-2 py-1">Slides: {preview.extraction.slideCount}</span>}</div>{(preview.extraction.warnings||[]).map((w,i)=><p key={i} className="bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-lg p-3">{w}</p>)}<div className="space-y-3">{(preview.extraction.sections||[]).map((s,i)=><div key={i} className="border border-slate-200 rounded-xl p-3"><b className="text-xs text-emerald-800">{s.label}</b><p className="text-xs text-slate-700 whitespace-pre-wrap break-words mt-2">{s.text||'(No readable text found in this section.)'}</p></div>)}</div>{!preview.extraction.sections?.length&&<p className="text-xs text-slate-500">No extracted text is available for this file.</p>}</>:<p className="text-xs text-slate-500">This file was stored, but no content extraction is available.</p>}</div></div>}
      </div>
    }

    function Theory(){const [query,setQuery]=useState('');const [open,setOpen]=useState(null);const list=KEYWORDS.filter(k=>(k.term+' '+k.meaningVi+' '+k.session).toLowerCase().includes(query.toLowerCase()));return <div className="space-y-4"><div><h2 className="text-xl font-black">Theory Review</h2><p className="text-xs text-slate-500 mt-1">English academic keywords with Vietnamese explanations.</p></div><div className="relative"><Search size={16} className="absolute left-3 top-3 text-slate-400"/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search keywords, meanings or sessions…" className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-3 py-3 text-sm"/></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-3">{list.map(k=><article key={k.id} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-extrabold text-emerald-800 bg-emerald-50 px-2 py-1 rounded">{k.session}</span><BookMarked size={16} className="text-emerald-600"/></div><h3 className="font-black">{k.term} <span className="text-emerald-700 text-sm font-bold">({k.meaningVi})</span></h3><div className="bg-slate-50 rounded-xl p-3"><b className="text-[10px] uppercase text-slate-500">English definition</b><p className="text-xs mt-1 leading-relaxed">{k.definitionEn}</p></div><p className="text-xs leading-relaxed"><b className="text-emerald-800">Giải thích:</b> {k.explanationVi}</p>{open===k.id&&<div className="rounded-xl bg-emerald-50 p-3 text-xs"><b>Ví dụ:</b> {k.example}</div>}<button onClick={()=>setOpen(open===k.id?null:k.id)} className="text-xs font-bold text-emerald-700">{open===k.id?'Hide example':'Show practical example'}</button></article>)}</div>{list.length===0&&<p className="text-center text-sm text-slate-500 py-8">No matching keywords.</p>}</div>}

    function Quiz({course,questions,attempted,setAttempted,addXp}){
      const [mode,setMode]=useState('fresh');const [filter,setFilter]=useState(()=>window.sessionStorage.getItem('uep-next-filter')||'ALL');const [index,setIndex]=useState(0);const [answers,setAnswers]=useState({});const [submitted,setSubmitted]=useState({});const [flagged,setFlagged]=useState({});const [ids,setIds]=useState([]);
      const allMatching=useMemo(()=>questions.filter(q=>q.courseCode===course.code&&(filter==='ALL'||q.sessionId===filter)),[questions,course.code,filter]);
      useEffect(()=>{const next=allMatching.filter(q=>mode==='review'||!attempted[q.id]).map(q=>q.id);setIds(next);setIndex(0);setAnswers({});setSubmitted({});window.sessionStorage.removeItem('uep-next-filter')},[mode,filter,course.id]);
      const list=ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);const q=list[index];const selected=q?(answers[q.id]??(mode==='review'?attempted[q.id]?.selected:undefined)):undefined;const isDone=q?!!submitted[q.id]||(mode==='review'&&!!attempted[q.id]):false;
      const submit=()=>{if(!q||selected===undefined)return;const ok=selected===q.correctIndex;setSubmitted(prev=>({...prev,[q.id]:true}));setAttempted(prev=>({...prev,[q.id]:{correct:ok,selected,timestamp:Date.now(),seen:true,attempts:(prev[q.id]?.attempts||0)+1}}));addXp(ok?25:5)};
      const resetCurrent=()=>{if(!q)return;setSubmitted(prev=>({...prev,[q.id]:false}));setAnswers(prev=>({...prev,[q.id]:undefined}));};
      if(!q)return <div className="max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl p-7 text-center"><Award size={35} className="mx-auto text-emerald-600"/><h2 className="text-lg font-black mt-3">{mode==='fresh'?'No unseen questions available':'No questions in this selection'}</h2><p className="text-xs text-slate-500 mt-2">{mode==='fresh'?'Bạn đã xem hoặc làm hết câu hỏi hiện có trong phần này. Hãy chuyển sang Review hoặc thêm ngân hàng câu hỏi mới.':'Không có câu hỏi phù hợp với bộ lọc này.'}</p><button onClick={()=>setMode(mode==='fresh'?'review':'fresh')} className="mt-4 bg-emerald-600 text-white rounded-xl px-4 py-2 text-xs font-bold">{mode==='fresh'?'Review questions':'Back to fresh practice'}</button></div>;
      const answeredCount=list.filter(item=>submitted[item.id]||attempted[item.id]).length;
      return <div className="max-w-3xl mx-auto space-y-4"><div className="bg-white border border-slate-200 rounded-2xl p-3 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between"><div className="flex flex-wrap gap-2"><select value={filter} onChange={e=>setFilter(e.target.value)} className="bg-slate-100 rounded-lg px-2 py-2 text-xs font-bold"><option value="ALL">All Sessions</option>{course.sessions.map(s=><option value={s.id} key={s.id}>{s.title}</option>)}</select><div className="flex bg-slate-100 p-1 rounded-lg"><button onClick={()=>setMode('fresh')} className={`px-3 py-1.5 rounded-md text-xs font-bold ${mode==='fresh'?'bg-emerald-600 text-white':'text-slate-600'}`}>Fresh ({allMatching.filter(x=>!attempted[x.id]).length})</button><button onClick={()=>setMode('review')} className={`px-3 py-1.5 rounded-md text-xs font-bold ${mode==='review'?'bg-emerald-600 text-white':'text-slate-600'}`}>Review all</button></div></div><span className="text-xs text-slate-500 font-bold">{answeredCount}/{list.length} attempted</span></div>
        <article className="bg-white border-2 border-emerald-500 rounded-2xl p-4 sm:p-6 shadow-sm space-y-5"><div className="flex flex-wrap justify-between gap-2 border-b border-slate-100 pb-3"><div className="flex flex-wrap gap-2"><span className="bg-emerald-100 text-emerald-800 rounded-md px-2 py-1 text-[10px] font-extrabold">{q.sessionTitle}</span><span className="bg-slate-100 text-slate-600 rounded-md px-2 py-1 text-[10px] font-bold">{q.origin}</span></div><span className="text-xs font-bold text-slate-500">Question {index+1} / {list.length}</span></div><div><p className="text-[10px] uppercase tracking-wider text-slate-400 font-bold">{q.topic} · Level {q.difficultyLevel}</p><h2 className="font-extrabold text-base sm:text-lg leading-relaxed mt-2">{q.question}</h2><p className="text-[10px] text-slate-400 mt-2">Source: {q.sourceDoc}</p></div>
        <div className="space-y-2">{q.options.map((option,i)=>{const chosen=selected===i;const correct=q.correctIndex===i;let style='border-slate-200 hover:border-emerald-400';if(chosen)style='border-emerald-500 bg-emerald-50';if(isDone&&correct)style='border-emerald-500 bg-emerald-100';if(isDone&&chosen&&!correct)style='border-red-400 bg-red-50';return <button key={i} disabled={isDone} onClick={()=>setAnswers(prev=>({...prev,[q.id]:i}))} className={`w-full text-left border-2 rounded-xl px-3 py-3 text-xs sm:text-sm flex items-center gap-3 ${style}`}><span className="w-6 h-6 rounded-full border flex items-center justify-center shrink-0 font-bold">{String.fromCharCode(65+i)}</span><span className="flex-1">{option}</span>{isDone&&correct&&<CheckCircle2 size={17} className="text-emerald-600"/>}</button>})}</div>
        {isDone&&<div className={`rounded-xl p-4 ${attempted[q.id]?.correct?'bg-emerald-50 border border-emerald-200':'bg-amber-50 border border-amber-200'}`}><div className="flex items-center gap-2 text-sm font-extrabold mb-2">{attempted[q.id]?.correct?<CheckCircle2 size={17}/>:<AlertCircle size={17}/>} {attempted[q.id]?.correct?'Correct answer':'Review this concept'}</div><p className="text-xs leading-relaxed">{q.explanationVi}</p><p className="text-[10px] text-slate-500 mt-2">Correct answer: {q.options[q.correctIndex]}</p></div>}
        <div className="flex flex-wrap items-center justify-between gap-2 pt-2"><button disabled={index===0} onClick={()=>setIndex(i=>Math.max(0,i-1))} className="border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold disabled:opacity-40 inline-flex items-center gap-1"><ChevronLeft size={15}/> Previous</button><button onClick={()=>setFlagged(p=>({...p,[q.id]:!p[q.id]}))} className={`text-xs font-bold px-2 py-2 ${flagged[q.id]?'text-amber-700':'text-slate-500'}`}>{flagged[q.id]?'★ Flagged':'☆ Flag for review'}</button>{!isDone?<button onClick={submit} disabled={selected===undefined} className="bg-emerald-600 text-white rounded-xl px-4 py-2 text-xs font-bold disabled:opacity-40">Check answer</button>:<button onClick={resetCurrent} className="border border-emerald-200 text-emerald-800 rounded-xl px-3 py-2 text-xs font-bold">Try again</button>}<button disabled={index===list.length-1} onClick={()=>setIndex(i=>Math.min(list.length-1,i+1))} className="bg-slate-900 text-white rounded-xl px-4 py-2 text-xs font-bold inline-flex items-center gap-1 disabled:opacity-40">Next <ArrowRight size={14}/></button></div>
        <div className="flex flex-wrap gap-1.5 border-t border-slate-100 pt-3">{list.map((item,i)=><button key={item.id} onClick={()=>setIndex(i)} className={`w-8 h-8 rounded-lg text-[11px] font-bold ${i===index?'bg-emerald-700 text-white':submitted[item.id]||attempted[item.id]?'bg-emerald-100 text-emerald-800':'bg-slate-100 text-slate-600'} ${flagged[item.id]?'ring-2 ring-amber-400':''}`}>{i+1}</button>)}</div></article></div>
    }

    function Analytics({course,questions,attempted,onPractice}){const qs=questions.filter(q=>q.courseCode===course.code);const done=qs.filter(q=>attempted[q.id]);const right=done.filter(q=>attempted[q.id].correct).length;const accuracy=done.length?Math.round(right/done.length*100):0;return <div className="space-y-4"><div><h2 className="text-xl font-black">Progress & Analytics</h2><p className="text-xs text-slate-500 mt-1">Practice statistics saved in this browser.</p></div><div className="grid grid-cols-1 sm:grid-cols-3 gap-3"><Stat title="Attempted" value={`${done.length}/${qs.length}`} sub="Available sample questions"/><Stat title="Accuracy" value={`${accuracy}%`} sub={`${right} correct answers`}/><Stat title="Preparation status" value={accuracy>=80&&done.length>=5?'Strong practice':done.length?'In progress':'Not started'} sub="Not an official grade prediction"/></div><section className="bg-white border border-slate-200 rounded-2xl p-4"><h3 className="font-extrabold text-sm mb-3">Session practice coverage</h3><div className="space-y-4">{course.sessions.map(s=>{const sq=qs.filter(q=>q.sessionId===s.id);const finished=sq.filter(q=>attempted[q.id]);const pct=sq.length?Math.round(finished.length/sq.length*100):0;return <div key={s.id}><div className="flex items-center justify-between gap-2 text-xs mb-1"><b>{s.title}</b><span className="text-slate-500">{finished.length}/{sq.length}</span></div><div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-emerald-600" style={{width:`${pct}%`}}/></div><button onClick={()=>onPractice(s.id)} className="text-[10px] text-emerald-700 font-bold mt-1">Practice this session</button></div>})}</div></section></div>}
    function Stat({title,value,sub}){return <div className="bg-white border border-slate-200 rounded-2xl p-4"><div className="text-[10px] uppercase text-slate-400 font-extrabold">{title}</div><div className="text-2xl font-black mt-1">{value}</div><div className="text-[10px] text-slate-500 mt-1">{sub}</div></div>}

    function Assistant({course}){const [input,setInput]=useState('');const [messages,setMessages]=useState([{role:'model',text:`Đây là trợ lý học tập demo cho môn ${course.name}. Gemini/OpenAI chưa được kết nối trong file HTML độc lập này. Bạn có thể hỏi các chủ đề mẫu hoặc dùng Theory Review.`}]);const send=(value=input)=>{const text=value.trim();if(!text)return;setMessages(prev=>[...prev,{role:'user',text}]);setInput('');const q=text.toLowerCase();let answer='Bản HTML này chưa kết nối AI trực tiếp. Để có câu trả lời theo tài liệu riêng, cần một backend an toàn và API key Gemini hoặc OpenAI.';if(q.includes('disintermediation'))answer='Disintermediation (loại bỏ hoặc thay thế trung gian) là việc nhà sản xuất cắt bỏ trung gian truyền thống hoặc nền tảng mới thay thế trung gian cũ. Chủ đề thuộc Session 10.';else if(q.includes('segmented pricing'))answer='Segmented pricing (định giá phân khúc) là bán cùng một sản phẩm hoặc dịch vụ ở nhiều mức giá, trong đó chênh lệch không xuất phát từ chênh lệch chi phí. Chủ đề thuộc Session 9.';else if(q.includes('myopia'))answer='Marketing Myopia là việc doanh nghiệp tập trung quá mức vào sản phẩm hiện tại và quên nhu cầu, lợi ích, trải nghiệm thật sự của khách hàng. Chủ đề thuộc Session 1.';setMessages(prev=>[...prev,{role:'model',text:answer}])};return <div className="max-w-4xl mx-auto h-[min(75vh,760px)] min-h-[480px] flex flex-col bg-white border border-slate-200 rounded-2xl overflow-hidden"><div className="bg-emerald-900 text-white p-4 flex items-center gap-3"><Bot className="text-emerald-300"/><div><h2 className="font-extrabold text-sm">AI Study Assistant</h2><p className="text-[10px] text-emerald-200">Demo responses · No live AI API configured</p></div></div><div className="p-2 bg-emerald-50 flex flex-wrap gap-2">{['Explain Marketing Myopia','Explain Segmented Pricing','Explain Disintermediation'].map(t=><button key={t} onClick={()=>send(t)} className="bg-white border border-emerald-200 text-emerald-800 rounded-lg px-2.5 py-1.5 text-[10px] font-bold">{t}</button>)}</div><div className="flex-1 overflow-y-auto bg-slate-50 p-3 sm:p-4 space-y-3">{messages.map((m,i)=><div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[90%] sm:max-w-[80%] p-3 rounded-2xl text-xs leading-relaxed whitespace-pre-wrap ${m.role==='user'?'bg-emerald-600 text-white':'bg-white border border-slate-200'}`}>{m.text}</div></div>)}</div><form onSubmit={e=>{e.preventDefault();send()}} className="border-t border-slate-200 p-3 flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask about a Marketing concept…" className="flex-1 min-w-0 rounded-xl bg-slate-100 px-3 py-2.5 text-xs"/><button className="bg-emerald-600 text-white rounded-xl px-4"><Send size={16}/></button></form></div>}

    function Courses({courses,activeId,onSelect,onAdd,onDelete}){const [show,setShow]=useState(false);const [form,setForm]=useState({university:'',faculty:'',code:'',name:'',examDate:'',targetGrade:'B'});const create=e=>{e.preventDefault();onAdd({...form,id:`course-${Date.now()}`,sessions:[],documents:[]}) ;setShow(false);setForm({university:'',faculty:'',code:'',name:'',examDate:'',targetGrade:'B'})};return <div className="space-y-4"><div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3"><div><h2 className="text-xl font-black">My Courses</h2><p className="text-xs text-slate-500">Manage independent course workspaces.</p></div><button onClick={()=>setShow(true)} className="bg-emerald-600 text-white rounded-xl px-4 py-2.5 text-xs font-bold inline-flex items-center justify-center gap-2"><Plus size={15}/> Add course</button></div><div className="grid grid-cols-1 lg:grid-cols-2 gap-3">{courses.map(c=><article key={c.id} className={`bg-white border-2 rounded-2xl p-4 ${c.id===activeId?'border-emerald-500':'border-slate-200'}`}><div className="flex items-center justify-between"><span className="bg-emerald-50 text-emerald-800 rounded px-2 py-1 text-[10px] font-extrabold">{c.code}</span><span className="text-xs text-slate-500">Goal: {c.targetGrade}</span></div><h3 className="font-extrabold mt-2">{c.name}</h3><p className="text-[11px] text-slate-500 mt-1">{c.university||'University not set'} · Exam: {c.examDate||'Not set'}</p><p className="text-[11px] text-emerald-700 font-bold mt-3">{c.sessions?.length||0} Sessions · {(c.documents||[]).length} documents</p><div className="flex justify-between items-center mt-4 pt-3 border-t"><button onClick={()=>onSelect(c.id)} className="bg-slate-900 text-white rounded-lg px-3 py-2 text-xs font-bold">Open course</button>{courses.length>1&&<button onClick={()=>onDelete(c.id)} className="text-red-500 p-2" aria-label="Delete course"><Trash2 size={16}/></button>}</div></article>)}</div>{show&&<div className="fixed inset-0 z-50 bg-black/50 p-3 flex items-center justify-center"><form onSubmit={create} className="bg-white rounded-2xl p-5 w-full max-w-md space-y-3"><div className="flex justify-between"><h3 className="font-black">Create course</h3><button type="button" onClick={()=>setShow(false)}><X size={18}/></button></div>{[['name','Course name'],['code','Course code'],['university','University'],['faculty','Faculty']].map(([key,label])=><label key={key} className="block text-xs font-bold">{label}<input required={key==='name'||key==='code'} value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1 text-sm"/></label>)}<label className="block text-xs font-bold">Exam date<input type="date" value={form.examDate} onChange={e=>setForm({...form,examDate:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1"/></label><label className="block text-xs font-bold">Target grade<select value={form.targetGrade} onChange={e=>setForm({...form,targetGrade:e.target.value})} className="w-full border rounded-lg px-3 py-2 mt-1">{GRADES.map(g=><option key={g.id}>{g.id}</option>)}</select></label><div className="flex justify-end gap-2"><button type="button" onClick={()=>setShow(false)} className="px-3 py-2 rounded-lg bg-slate-100 text-xs font-bold">Cancel</button><button className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold">Create</button></div></form></div>}</div>}

    try{ReactDOM.createRoot(document.getElementById('root')).render(<App/>)}catch(error){document.getElementById('root').innerHTML=`<div style="padding:24px;color:#991b1b;font:14px system-ui"><h2>Application error</h2><pre style="white-space:pre-wrap">${String(error)}</pre></div>`;console.error(error)}
  </script>
</body>
</html>
